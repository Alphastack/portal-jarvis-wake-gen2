name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - run: ./gradlew --no-daemon test lint assembleDebug assembleRelease
      - name: Verify packaged Portal ABIs
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/' /tmp/apk-files.txt
          grep -q 'lib/armeabi-v7a/' /tmp/apk-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: portal-jarvis-wake-gen2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
